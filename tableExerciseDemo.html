<!--
  A TABLE EXERCISE - answer cells inside a table, one keyboard docked under the table.

  Every blank cell is its own keyboard (its own answer, its own keys: numbers only, or x, y and =), but only its
  answer box stays in the cell. The keys of the cell being edited open in ONE dock under the table:
    - the table keeps its size - nothing opens inside a cell, nothing covers the rows below it
    - in a frame that follows its content (STACK-JS) the dock is part of the page, so the frame grows with it
    - click a cell: its keys move into the dock; Tab / Enter: the next cell, Shift+Tab: the previous one;
      Esc, × or a click outside the table: the dock closes
  Several keyboards on one page: each is created with physicalKeyboard: false and the page passes the computer's
  keys to the cell being edited (keyboardExamples.html, "Several keyboards on one page").

  The dock is built here, on the page, from the keyboard's own parts (popup, display, dragBar, keyboardToggleButton).
  If it is kept, it belongs in fullKbdLib-v4.js as an option (e.g. layout: "docked", dockId), like the chemistry
  keyboard's layout: "docked".

  Scripts: MathJax 3 (with [tex]/html), fullKbdLib-v4.js, mathCheck.js - the public copies (host your own in production).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Functions Table</title>

<script>
window.MathJax = {
    loader: { load: ["[tex]/html"] },
    tex: { packages: { "[+]": ["html"] }, inlineMath: [["\\(", "\\)"]] },
    svg: { fontCache: "global" }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script src="https://raw.githack.com/AviNat/MathVKBD/main/fullKbdLib-v4.js"></script>
<script src="https://raw.githack.com/AviNat/MathVKBD/main/mathCheck.js"></script>

<style>
body { font: 17px/1.6 "Segoe UI", Arial, sans-serif; color: #1d2733; background: #f4f6f9; margin: 0; padding: 16px; }
.exercise { max-width: 980px; margin: 0 auto; background: #fff; border: 1px solid #d5dce4; border-radius: 12px; padding: 18px 20px; }
.task { margin: 0 0 6px; }
.hint { margin: 0 0 14px; font-size: 14px; color: #5a6878; }

.table-wrap { overflow-x: auto; }
table.lin { border-collapse: collapse; width: 100%; min-width: 720px; }
table.lin th, table.lin td { border: 1px solid #c9d2dc; padding: 8px; text-align: center; vertical-align: middle; }
table.lin th { background: #eef2f7; font-size: 15px; font-weight: 600; }
table.lin th.row-no, table.lin td.row-no { width: 34px; color: #5a6878; font-size: 14px; }
table.lin td.given { background: #fafbfc; }
table.lin td.right { background: #e9f7ef; }
table.lin td.wrong { background: #fdecea; }

/* a blank: the keyboard's answer box only (its keys open in the dock) */
.fill { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.blank { display: inline-block; vertical-align: middle; width: 96px; border-radius: 8px; }
.blank.wide { width: 200px; }
.blank.active { box-shadow: 0 0 0 3px #1f5f99; }

/* the dock: the keys of the cell being edited, under the table */
#dock { margin-top: 12px; border: 1px solid #1f5f99; border-radius: 10px; background: #f7f9fc; padding: 8px 10px 10px; }
#dock[hidden] { display: none; }
.dock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dock-title { flex: 1; font-weight: 600; font-size: 15px; }
.dock-head button { font: inherit; font-size: 14px; padding: 2px 10px; border: 1px solid #9aa9b9; border-radius: 6px; background: #fff; cursor: pointer; }
.dock-head button.close { font-size: 18px; line-height: 1; padding: 2px 9px; }
#dockBody { overflow-x: auto; }

.actions { margin-top: 14px; }
#submit { font: inherit; font-weight: 600; padding: 7px 24px; border: none; border-radius: 8px; background: #1f5f99; color: #fff; cursor: pointer; }
#result { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: #f8fafc; border: 1px solid #d5dce4; }
#grade { font-size: 24px; font-weight: 700; }
#feedback div { font-size: 15px; margin-top: 4px; }
</style>
</head>
<body>

<div class="exercise">
  <p class="task">Complete the table. Every row describes one line \(y = mx + b\).</p>
  <p class="hint">Click an empty cell to type in it. Tab or Enter moves to the next cell; Esc closes the keys.</p>

  <div class="table-wrap"><table class="lin" id="table"></table></div>

  <!-- the keys of the cell being edited (hidden while no cell is) -->
  <div id="dock" hidden>
    <div class="dock-head">
      <span class="dock-title" id="dockTitle"></span>
      <button type="button" id="dockPrev">‹ Previous</button>
      <button type="button" id="dockNext">Next ›</button>
      <button type="button" class="close" id="dockClose" title="Close">×</button>
    </div>
    <div id="dockBody"></div>
  </div>

  <div class="actions"><button type="button" id="submit">Check</button></div>

  <div id="result" hidden>
    <div id="grade"></div>
    <div id="feedback"></div>
  </div>
</div>

<script>
/* ---------- the keys of a cell ---------- */
const NUMBER = {                                    // slope, a coordinate: a number (fractions, negatives)
    language: "en",
    variables: [],
    enableEquals: false,
    complexNumbers: false,
    sets: false,
    functions: {},
    structures: {},
    symbols: {},
    multiplicationSymbol: "cdot"
};
const EQUATION = Object.assign({}, NUMBER, {         // the equation: x, y and "="
    variables: [{ id: "x", label: "x", latex: "x" }, { id: "y", label: "y", latex: "y" }],
    enableEquals: true
});

/* ---------- reference answers, in the keyboard's semantic AST ---------- */
const N = function (v) { return { type: "number", value: String(v) }; };
const V = function (name) { return { type: "variable", name: name }; };
const op = function (o) { return { type: "operation", op: o, operands: Array.prototype.slice.call(arguments, 1) }; };
const eq = function (left, right) { return { type: "chain", elements: [left, right] }; };
const x = V("x"), y = V("y");

/*
 * THE TABLE - data. A cell is given ({ tex }) or a blank ({ answer, keys }); before / after are LaTeX shown in the
 * cell around the answer box: "(4, ▢)" asks for one coordinate of a point.
 */
const COLUMNS = ["Slope \\(m\\)", "Intersection with the \\(y\\)-axis", "Equation \\(y = mx + b\\)", "A point on the line"];
const COLUMN_NAMES = ["Slope", "Intersection with the y-axis", "Equation", "Point"];

const ROWS = [
    /* m and b given: the equation, and y at x = 4 */
    [{ tex: "2" },
     { tex: "(0,\\ -3)" },
     { answer: eq(y, op("+", op("*", N(2), x), op("neg", N(3)))), keys: EQUATION },        // y = 2x − 3
     { before: "(4,\\ ", answer: N(5), after: ")", keys: NUMBER }],                           // 2·4 − 3 = 5
    /* b and a point given: the slope, and the equation */
    [{ answer: op("neg", N(3)), keys: NUMBER },                                                // (−5 − 1) / 2 = −3
     { tex: "(0,\\ 1)" },
     { answer: eq(y, op("+", op("*", op("neg", N(3)), x), N(1))), keys: EQUATION },          // y = −3x + 1
     { tex: "(2,\\ -5)" }],
    /* m and a point given: b, and the equation */
    [{ tex: "-\\tfrac{1}{2}" },
     { before: "(0,\\ ", answer: N(3), after: ")", keys: NUMBER },                            // 1 + ½·4 = 3
     { answer: eq(y, op("+", op("*", op("neg", op("/", N(1), N(2))), x), N(3))), keys: EQUATION },   // y = −½x + 3
     { tex: "(4,\\ 1)" }],
    /* the equation given: m, b, and x where y = 5 */
    [{ answer: N(3), keys: NUMBER },
     { before: "(0,\\ ", answer: op("neg", N(7)), after: ")", keys: NUMBER },
     { tex: "y = 3x - 7" },
     { before: "(", answer: N(4), after: ",\\ 5)", keys: NUMBER }]                            // 3x − 7 = 5 → x = 4
];

/* ---------- building the table ---------- */
const $ = function (id) { return document.getElementById(id); };
const blanks = [];                                  // in reading order - Tab goes through them

function math(tex) {
    const span = document.createElement("span");
    span.textContent = "\\(" + tex + "\\)";
    return span;
}

(function buildTable() {
    const table = $("table");
    const head = table.createTHead().insertRow();
    const corner = document.createElement("th");
    corner.className = "row-no";
    head.appendChild(corner);
    COLUMNS.forEach(function (title) {
        const th = document.createElement("th");
        th.textContent = title;
        head.appendChild(th);
    });

    const body = table.createTBody();
    ROWS.forEach(function (row, r) {
        const tr = body.insertRow();
        const no = tr.insertCell();
        no.className = "row-no";
        no.textContent = r + 1;
        row.forEach(function (cell, c) {
            const td = tr.insertCell();
            if (!cell.answer) {
                td.className = "given";
                td.appendChild(math(cell.tex));
                return;
            }
            const fill = document.createElement("span");
            fill.className = "fill";
            if (cell.before) fill.appendChild(math(cell.before));
            const host = document.createElement("div");
            host.id = "cell-" + r + "-" + c;
            host.className = "blank" + (cell.keys === EQUATION ? " wide" : "");
            fill.appendChild(host);
            if (cell.after) fill.appendChild(math(cell.after));
            td.appendChild(fill);
            blanks.push({ row: r, col: c, cell: cell, host: host, td: td, keyboard: null });
        });
    });
})();

/* ---------- a keyboard in every blank, its keys in the dock ---------- */
let active = null;                                  // the blank being edited

blanks.forEach(function (blank) {
    const keyboard = new MoodleMathKeyboard(Object.assign({}, blank.cell.keys, {
        divId: blank.host.id,
        physicalKeyboard: false,                    // several keyboards: the page passes the keys (below)
        onChange: function () { blank.td.classList.remove("right", "wrong"); }
    }));
    blank.keyboard = keyboard;

    /* only the answer box stays in the cell */
    keyboard.keyboardToggleButton.style.display = "none";      // a click on the box opens the keys
    keyboard.displayContainer.style.marginBottom = "0";
    keyboard.display.style.minHeight = "40px";
    keyboard.display.style.fontSize = "18px";
    keyboard.display.style.padding = "4px 8px";
    keyboard.caret.style.visibility = "hidden";               // a cursor in the cell being edited only

    /* the keys: no floating window - they move into the dock (which has its own title and ×) */
    keyboard.dragBar.style.display = "none";
    const keys = keyboard.popup;
    keys.style.position = "static";
    keys.style.border = "none";
    keys.style.boxShadow = "none";
    keys.style.padding = "0";
    keys.style.backgroundColor = "transparent";

    keyboard.showKeyboard = function () { openDock(blank); };
    keyboard.hideKeyboard = function () { closeDock(); };
});

function openDock(blank) {
    if (active === blank) return;
    if (active) leave(active);
    active = blank;
    $("dockBody").appendChild(blank.keyboard.popup);
    blank.keyboard.popup.style.display = "block";
    blank.keyboard.caret.style.visibility = "visible";
    blank.host.classList.add("active");
    $("dockTitle").textContent = "Row " + (blank.row + 1) + " · " + COLUMN_NAMES[blank.col];
    $("dockPrev").disabled = blanks.indexOf(blank) === 0;
    $("dockNext").disabled = blanks.indexOf(blank) === blanks.length - 1;
    $("dock").hidden = false;
}

function leave(blank) {
    blank.keyboard.popup.style.display = "none";
    blank.keyboard.caret.style.visibility = "hidden";
    blank.host.classList.remove("active");
}

function closeDock() {
    if (!active) return;
    leave(active);
    active = null;
    $("dock").hidden = true;
}

function move(step) {
    if (!active) return;
    const next = blanks[blanks.indexOf(active) + step];
    if (next) openDock(next);
    else closeDock();                               // past the last cell: done typing
}

$("dockPrev").addEventListener("click", function () { move(-1); });
$("dockNext").addEventListener("click", function () { move(1); });
$("dockClose").addEventListener("click", closeDock);

/* the computer's keys go to the cell being edited; Tab / Enter / Esc move between the cells */
document.addEventListener("keydown", function (event) {
    if (!active) return;
    if (event.key === "Escape") { event.preventDefault(); closeDock(); return; }
    if (event.key === "Tab" || event.key === "Enter") {
        event.preventDefault();
        move(event.shiftKey ? -1 : 1);
        return;
    }
    active.keyboard.handlePhysicalKey(event);
});

/* a click outside the cells and the dock closes it (the keys and the answer boxes stop their own clicks) */
document.addEventListener("click", function (event) {
    if (active && !$("dock").contains(event.target) && !event.target.closest(".blank")) closeDock();
});

/* ---------- Check: every blank on its own, the grade is the average ---------- */
$("submit").addEventListener("click", function () {
    closeDock();
    let total = 0;
    const lines = [];
    blanks.forEach(function (blank) {
        const empty = blank.keyboard.getLatex().replace(/\s+/g, "") === "";
        const result = empty ? { grade: 0, feedback: "No answer yet." }
            : MathCheck.compare(blank.keyboard.getAST(), blank.cell.answer, {}, null, { language: "en" });
        total += result.grade;
        blank.td.classList.remove("right", "wrong");
        blank.td.classList.add(result.grade === 100 ? "right" : "wrong");
        if (result.grade < 100) {
            lines.push("Row " + (blank.row + 1) + ", " + COLUMN_NAMES[blank.col] + ": " + result.feedback);
        }
        saveToLearningSystem(blank, result);
    });
    showResult(Math.round(total / blanks.length), lines);
});

function showResult(grade, lines) {
    $("grade").textContent = grade + "%";
    const feedback = $("feedback");
    feedback.textContent = "";
    if (lines.length === 0) lines = ["All the cells are correct."];
    lines.forEach(function (line) {
        const div = document.createElement("div");
        div.textContent = line;
        feedback.appendChild(div);
    });
    $("result").hidden = false;
    /* through the keyboard's MathJax queue - typesetting at the same time as a keyboard breaks both */
    const typeset = function () { return MathJax.typesetPromise([feedback]); };
    if (typeof queueMathJax === "function") queueMathJax(typeset);
    else if (window.MathJax && MathJax.typesetPromise) typeset();
}

/* THE LEARNING SYSTEM - replace with the system's own call: one answer per cell (the AST, the LaTeX) and its grade */
function saveToLearningSystem(blank, result) {
    console.log("row", blank.row + 1, COLUMN_NAMES[blank.col], "latex:", blank.keyboard.getLatex(), "grade:", result.grade);
}
</script>
</body>
</html>
