<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full keyboard - harness</title>
<script>
/* the html extension (\cssId - the cursor marker) loaded with MathJax, as in FullKBD.html */
window.MathJax = {
    loader: {
        load: ["[tex]/html"]
    },
    tex: {
        packages: {
            "[+]": ["html"]
        },
        inlineMath: [["\\(", "\\)"]]
    },
    svg: {
        fontCache: "global"
    }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script src="fullKbdLib-v4.js"></script>
</head>
<body>
<div id="keyboardHost"></div>

<script>
let keyboard = new MoodleMathKeyboard({
    divId: "keyboardHost",

    complexNumbers: true,
    multiplicationSymbol: "cdot",

    variables: [
        { id: "x", label: "x", latex: "x" },
        { id: "ab", label: "ab", latex: "ab" },
        { id: "alpha", label: "α", latex: "\\alpha" }
    ],

    onChange: function(result) {
        console.log(result.latex);
        console.log(result.ast);
    }
});
</script>
</body>
</html>
