<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Keyboard V2 Test</title>
<script>
window.MathJax = {
    loader: {
        load: ["[tex]/html"]
    },
    tex: {
        packages: {
            "[+]": ["html"]
        },
        inlineMath: [["\\(", "\\)"]]
    },
    svg: {
        fontCache: "global"
    }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<script src="fullKbdLib-v4.js"></script>
</head>
<body>
    <p>Keyboard test - v4</p>
<div id="keyboardHost"></div>
<p>LaTeX: <input id="latexValue" type="text" size="80" readonly dir="ltr"></p>
<pre id="astValue" dir="ltr"></pre>

<script>
function keyboardChanged(result) {
   // document.getElementById("latexValue").value = result.latex;
  //  document.getElementById("astValue").textContent = JSON.stringify(result.ast, null, 2);
}
let keyboard = new MoodleMathKeyboard({
    divId: "keyboardHost",
    complexNumbers: true,
    enableEquals: true,
    sets: false,

    multiplicationSymbol: "cdot",
    showImplicitMultiply: true,
    placeholderTooltips: true,
    fixedCalculusVariable: "x", 
    language: "he", 
    variables: [
        { id: "x", label: "x", latex: "x" },
        { id: "y", label: "y", latex: "y" },
        { id: "z", label: "z", latex: "z" },
        { id: "ab", label: "ab", latex: "ab" },
        { id: "alpha", label: "α", latex: "\\alpha" }
    ],
    physicalKeyboard: true,
    acceptLowercaseVariables: true,
    acceptUppercaseVariables: true,
    functions: {
        logarithmic: true,
        trigonometric: true,
        inverseTrigonometric: true,
        hyperbolic: true,
        inverseHyperbolic: true,
        namedFunction: true
    },
    structures: {
        integral: true,
        evaluation: true,
        summation: true,
        product: true,
        limit: true,
        absoluteValue: true,
        vector: "both",          // "none" | "arrow" | "underline" | "both"
        derivative: true,
        partialDerivative: true
    },
   symbols: {
        general: true,
        relations: true,
        logic: true,
        geometry: true
    },
    withUnits: true,
    unitCategories: {
        length: true,
        area: true,
        volume: true,
        time: true,
        speed: true,
        acceleration: true,
        angle: true
    },
    debug: true,
    onChange: keyboardChanged
});
</script>
</body>
</html>
